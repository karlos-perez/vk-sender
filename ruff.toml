line-length = 120
target-version = "py37"

extend-exclude = [
  ".cache",
  "venv",
  ".venv",
  "static",
  "migrations",
  "templates",
  "tmp",
]

[lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # warnings
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "DJ",   # django
  "SIM",  # simplify
  "PIE",  # flake8-pie
  "T20",  # print
  "PT",   # pytest-style
  "I",    # isort (сортировка импортов)
  "UP",   # pyupgrade
  "RUF",  # общая группа правил, реализованных в ruff
  "PYI",  # проверки, связанные с .pyi (type stub) файлами и синтаксисом подсказок типов (stubs / typing interface)
  "PLR",  # pylint-refactor
  "ANN",  # flake8-annotations (проверка аннотаций)
]
ignore = [
  "E501",    # длина строки (игнорируем как в flake8)
  "D107",    # наличия docstring в методе __init__
  "D414",    # Docstring: Section has no content ("Returns")
  "ANN204",  # __init__ может быть без -> None
  "UP006",   # Use `dict` instead of `Dict` for type annotation
  "UP045",   # Use `X | None` for type annotations
  "RUF001",  # Docstring contains ambiguous `е`
  "RUF002",  # Docstring contains ambiguous `е`
  "RUF003",  # Docstring contains ambiguous `е`
  "ANN002",  # Missing type annotation for `*args`
  "ANN003",  # Missing type annotation for `**kwargs`
  "PLR6301", # Method could be a function, class method, or static method
]
preview = true

[lint.per-file-ignores]
"*test*.py" = [
    "T201",      # print found - часто разрешен в тестах
    "T203",      # pprint found
    "SIM115",    # открытие файла без контекстного менеджера
    "I001",      # неправильный порядок импортов
    "S101",      # assert используется (разрешаем в тестах)
    "PLR2004",   # магические числа (в тестах часто допустимы)
    "ANN",       # отсутствие аннотаций типов (в тестах необязательно)
]
"*__init__.py" = ["D", "ANN"]   # __init__.py без docstring и аннотаций

[lint.flake8-annotations]
mypy-init-return = true          # требовать аннотацию для __init__ (аналог mypy)
suppress-dummy-args = false      # игнорировать dummy аргументы (_)
suppress-none-returning = false  # игнорировать функции, возвращающие None
allow-star-arg-any = false       # разрешить *args, **kwargs без типов
ignore-fully-untyped = false     # игнорировать полностью неаннотированные

[lint.pydocstyle]
convention = "google"

[lint.isort]
force-single-line = false
length-sort = false
combine-as-imports = false            # объединять импорты с as
force-wrap-aliases = true             # переносы как в multi_line_output=3
split-on-trailing-comma = true        # запятая в конце (вместо include-trailing-comma)
lines-after-imports = 2               # пустые строки после импортов
known-first-party = ["."]             # FIRSTPARTY = src_paths = .
known-local-folder = ["LOCALFOLDER"]  # локальные импорты
known-third-party = [
  "vkbottle",
  "django-rq",
]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[format]
quote-style = "single"             # кавычки
indent-style = "space"             # пробелы
line-ending = "lf"                 # перенос строк
skip-magic-trailing-comma = false  # учитывать trailing comma
docstring-code-format = true       # форматирует Python-код внутри docstring
